[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tecpap-orders"
version = "3.0.0"
description = "Saisie automatique des commandes TECPAP reçues par email et WhatsApp, validées par l'équipe commerciale avant export vers SAGE X3."
readme = "README.md"
# Python 3.10 n'est plus maintenu depuis octobre 2026 ; l'image Docker utilise Python 3.11.
requires-python = ">=3.11"
authors = [{ name = "Salah Eddine EL AZOUTI" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Flask",
    "Natural Language :: French",
    "Private :: Do Not Upload",
]
# Versions acceptées. Les versions exactes, testées et installées dans l'image Docker, sont
# figées dans requirements.txt (exécution) et requirements-dev.txt (développement), produits à
# partir de cette liste par la commande écrite en tête de chaque fichier (requirements.txt d'abord,
# puis requirements-dev.txt, qui reprend ses versions). Pour changer une version, relancer ces
# commandes puis la suite de tests. La borne supérieure exclut la version majeure suivante, qui
# peut rompre la compatibilité ; la borne inférieure de Flask et de python-dotenv exclut les
# versions visées par une vulnérabilité publiée (PYSEC-2026-2151, PYSEC-2026-2270).
dependencies = [
    # Configuration
    "python-dotenv>=1.2.2,<2",
    # Application web
    "flask>=3.1.3,<4",
    "gunicorn>=23.0,<27; platform_system != 'Windows'",
    # Modèles de langue (extraction, transcription Whisper, vision)
    "openai>=1.12,<4",
    "pydantic>=2.5,<3",
    # Canaux : WhatsApp (Twilio) et téléchargement des médias
    "twilio>=8.10,<10",
    "requests>=2.32.4,<3",
    # Base de connaissances : en-têtes YAML des documents Markdown
    "PyYAML>=6.0,<7",
    # Lecture des pièces jointes
    "pypdf>=6.1,<7",
    "Pillow>=11.3,<14",
    # Statistiques et exports (Excel, CSV, PDF)
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "openpyxl>=3.1,<4",
    "reportlab>=4.0,<5",
    "matplotlib>=3.8,<4",
    # Base des fuseaux horaires IANA pour zoneinfo : Windows n'en fournit pas.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Tests, couverture de code, analyse statique et contrôles de sécurité. Versions exactes pour les
# outils d'analyse : chaque version peut ajouter des règles, les résultats restent reproductibles.
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=4.0,<8",
    "ruff==0.17.2",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
include = ["tecpap*"]

[tool.setuptools.package-data]
"tecpap.web" = ["templates/*.html", "static/images/*"]

# ---------------------------------------------------------------- ruff (analyse statique)

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "venv", "build", "dist"]

[tool.ruff.lint]
# E/W : style PEP 8, F : erreurs détectées par pyflakes, I : ordre des imports,
# B : erreurs probables (flake8-bugbear), UP : syntaxe Python moderne (pyupgrade).
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",  # appel de fonction dans une valeur par défaut d'argument (usage courant avec Flask)
    "B904",  # « raise … from » non imposé dans les gestionnaires d'erreurs des routes
    "UP017",  # timezone.utc reste accepté : l'alias datetime.UTC (Python 3.11) n'apporte rien de plus
]

[tool.ruff.lint.per-file-ignores]
# Gabarits d'emails HTML : lignes longues inévitables.
"tecpap/channels/email_sender.py" = ["E501"]
# Rapport PDF : appels de mise en page reportlab et matplotlib sur une seule ligne.
"tecpap/reporting/pdf_report.py" = ["E501"]
# Tests : messages et données d'exemple écrits sur une seule ligne.
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tecpap"]

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# --strict-markers : un marqueur qui n'est pas déclaré (faute de frappe) est une erreur. Aucun marqueur
# propre au projet n'est déclaré : le test le plus long dure quelques secondes, la durée de la suite
# vient de son nombre de tests, et aucune sélection par marqueur ne l'écourterait.
addopts = "-ra --strict-markers"
# Un test qui dépasse 120 secondes (verrou jamais libéré, par exemple) provoque l'affichage de la
# pile d'appels de tous les fils d'exécution, pour trouver la cause du blocage.
faulthandler_timeout = 120
filterwarnings = [
    # requests signale des versions d'urllib3 ou de chardet plus récentes que celles qu'il connaît.
    "ignore::requests.exceptions.RequestsDependencyWarning",
    # Avertissements internes de matplotlib (dépendances pyparsing et numpy), sans effet sur les graphiques.
    "ignore::DeprecationWarning:matplotlib.*",
]

[tool.coverage.run]
source = ["tecpap"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
