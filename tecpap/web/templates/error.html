<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - TECPAP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; font-weight: 500; padding: 10px 20px; border-radius: 8px; transition: all 0.2s; box-shadow: 0 2px 8px rgba(59, 130, 246, 0.25); display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35); }
    </style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4 py-10">
    <main class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 p-8 text-center">
        <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-triangle-exclamation text-red-500 text-2xl"></i>
        </div>
        <p class="text-sm font-semibold text-slate-400">Erreur {{ status }}</p>
        <h1 class="text-xl font-bold text-slate-800 mt-1">{{ title }}</h1>
        <p class="text-slate-500 mt-2">{{ message }}</p>
        <a href="{{ url_for('pages.index') }}" class="btn-primary mt-6"><i class="fas fa-house"></i>Retour au tableau de bord</a>
    </main>
</body>
</html>
