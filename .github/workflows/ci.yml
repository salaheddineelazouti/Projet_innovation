# Intégration continue : analyse statique, tests sur trois versions de Python, contrôles de
# sécurité, puis construction de l'application et de l'image Docker, qui est démarrée et sondée.
# Les tests n'utilisent aucun secret : tous les services externes (OpenAI, Twilio, IMAP, SMTP)
# sont simulés.
#
# Les dépendances sont installées aux versions exactes de requirements.txt (exécution) et de
# requirements-dev.txt (développement), les mêmes que dans l'image Docker. Les actions GitHub sont
# désignées par l'empreinte de leur commit, avec leur version en commentaire.

name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Analyse statique (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer ruff
        run: |
          python -m pip install --upgrade pip
          pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: Lancer ruff
        run: ruff check . --output-format=github

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lancer les tests avec mesure de couverture
        run: pytest --cov=tecpap --cov-report=xml --cov-report=term-missing

      - name: Publier le rapport de couverture
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: couverture
          path: coverage.xml

  security:
    name: Contrôles de sécurité
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # bandit et pip-audit sont installés avec les versions exactes de requirements-dev.txt.
      - name: Installer les outils de contrôle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Le rapport de bandit est publié dans l'onglet du travail et comme artefact, sans bloquer
      # le pipeline : les alertes de sévérité moyenne sont examinées une à une dans ce rapport.
      - name: Analyse du code (bandit)
        continue-on-error: true
        run: bandit -r tecpap app.py scripts --severity-level medium --format txt --output bandit.txt

      - name: Résumé du rapport de bandit
        if: always()
        run: |
          if [ -f bandit.txt ]; then
            {
              echo '### Analyse du code (bandit)'
              echo '```'
              sed -n '/^Run metrics:/,$p' bandit.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publier le rapport de bandit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-bandit
          path: bandit.txt
          if-no-files-found: warn

      # Les versions auditées sont celles de requirements.txt, donc celles de l'image Docker. Une
      # vulnérabilité connue bloque le pipeline ; une alerte acceptée s'ajoute avec
      # --ignore-vuln IDENTIFIANT, accompagnée de la raison de l'acceptation.
      - name: Vulnérabilités connues des dépendances (pip-audit)
        run: pip-audit -r requirements.txt --no-deps --disable-pip

  build:
    name: Construction de l'application et de l'image Docker
    runs-on: ubuntu-latest
    needs: [tests, security]
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Créer l'application
        env:
          APP_ENV: test
        run: python -c "from tecpap.web import create_app; create_app()"

      - name: Construire l'image Docker
        run: docker build --tag tecpap-orders:${{ github.sha }} .

      # Le conteneur démarre sous gunicorn avec les réglages de production, puis /healthz est sondé.
      - name: Démarrer l'image et sonder /healthz
        run: bash .github/scripts/smoke_image.sh tecpap-orders:${{ github.sha }}
