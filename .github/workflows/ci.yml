# Intégration continue : analyse statique, tests sur trois versions de Python,
# contrôles de sécurité et construction de l'image Docker.
# Les tests n'utilisent aucun secret : tous les services externes (OpenAI, Twilio, IMAP, SMTP)
# sont simulés.

name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Analyse statique (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer ruff
        run: |
          python -m pip install --upgrade pip
          pip install "$(grep '^ruff' requirements-dev.txt)"

      - name: Lancer ruff
        run: ruff check . --output-format=github

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lancer les tests avec mesure de couverture
        run: pytest --cov=tecpap --cov-report=xml --cov-report=term-missing

      - name: Publier le rapport de couverture
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: coverage.xml

  security:
    name: Contrôles de sécurité
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer bandit et pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      # Les deux contrôles produisent un rapport sans bloquer le pipeline : chaque alerte est
      # examinée, puis traitée ou justifiée.
      - name: Analyse du code (bandit)
        continue-on-error: true
        run: bandit -r tecpap app.py scripts --severity-level medium

      - name: Vulnérabilités connues des dépendances (pip-audit)
        continue-on-error: true
        run: pip-audit -r requirements.txt

  build:
    name: Construction de l'application et de l'image Docker
    runs-on: ubuntu-latest
    needs: [tests, security]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Créer l'application
        env:
          APP_ENV: test
        run: python -c "from tecpap.web import create_app; create_app()"

      - name: Construire l'image Docker
        run: docker build --tag tecpap-orders:${{ github.sha }} .
