# Publication d'une version : à chaque étiquette v* (par exemple v3.0.0), les tests sont relancés
# puis l'image Docker est construite et publiée comme artefact du workflow.
#
# Aucune cible de déploiement n'est configurée (pas de registre d'images ni de serveur) :
# l'image est téléchargée depuis l'onglet Actions puis chargée sur le serveur avec
# « docker load -i tecpap-orders.tar.gz ». Pour automatiser le déploiement, ajouter une étape
# de publication vers un registre (avec ses identifiants dans les secrets du dépôt).

name: Publication

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  tests:
    name: Tests avant publication
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: pytest

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build --tag tecpap-orders:${{ github.ref_name }} .

      - name: Exporter l'image
        run: docker save tecpap-orders:${{ github.ref_name }} | gzip > tecpap-orders.tar.gz

      - name: Publier l'image comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: tecpap-orders-${{ github.ref_name }}
          path: tecpap-orders.tar.gz
          retention-days: 30
